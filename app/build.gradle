plugins {
    id 'com.android.application'
}

android {
    namespace 'com.microbusrush.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.microbusrush.game'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the standard debug key so the APK installs directly on any phone.
            // For Google Play you would add your own upload key here instead.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Sideloaded APK: don't let Play-Store policy lint checks block the build.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
